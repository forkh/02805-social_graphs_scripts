[project]
name = "scripts-dense-embeddings"
version = "1.0.0"
description = "Dense-embedding stance pipeline for Løgtingið 2020-2023: FPSC speeches linked to scraped votes, GPU embedding of 15 encoders, leave-one-out pro/con axis analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Versions below are the ones the pipeline was run with; uv.lock pins them and
# all transitive dependencies exactly.
#
# torch is intentionally NOT a locked dependency: its wheel depends on the GPU
# backend. scripts/setup.sh installs the pinned build per backend afterwards:
#   rocm (AMD, TheRock):  torch==2.14.0+rocm10.1.0  from https://stable.repo.amd.com/rocm/whl-next/
#   cuda (NVIDIA, cu132): torch==2.15.0+cu132       from https://download.pytorch.org/whl/cu132
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "tqdm==4.70.1",
    "huggingface-hub==2.4.0",
    "transformers==5.22.2",
    "sentence-transformers==6.2.0",
    "datasets==5.2.0",
    "accelerate>=1.10",
    "einops>=0.8",
]

[tool.uv]
# torch ROCm/CUDA wheels exist for linux x86_64 only — lock for that target.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
